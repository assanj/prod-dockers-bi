services:
  tabix:
    image: spoonest/clickhouse-tabix-web-client:latest
    container_name: tabix
    ports:
      - 8181:80
    environment:
      TABIX_DEFAULT_SERVER: ${CLICKHOUSE_HOST:-host.docker.internal}
      TABIX_DEFAULT_PORT: ${CLICKHOUSE_PORT:-8123}
      TABIX_DEFAULT_LOGIN: ${CLICKHOUSE_USER:-default}
      TABIX_DEFAULT_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TABIX_DEFAULT_DATABASE: ${CLICKHOUSE_DB:-default}
      TABIX_TITLE: "ClickHouse Tabix"
      TABIX_READONLY: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/"]
      interval: 30s
      timeout: 5s
      retries: 3
