version: '3.8'

services:
  metabase-init:
    image: postgres:16-alpine
    container_name: metabase_init
    env_file:
      - ../.env           # global
      - .env              # local
    volumes:
      - ./docker-metabase-init.sh:/docker-metabase-init.sh
    command: ["sh", "/docker-metabase-init.sh"]
    network_mode: host
    restart: "on-failure"

  metabase:
    depends_on:
      metabase-init:
        condition: service_completed_successfully
    env_file:
      - .env
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    network_mode: host
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: localhost
      MB_DB_PORT: ${POSTGRES_PORT:-5432}
      MB_DB_DBNAME: ${METABASE_DATABASE_NAME:-metabase}
      MB_DB_USER: ${METABASE_DATABASE_USER:-metabase}
      MB_DB_PASS: ${METABASE_DATABASE_PASSWORD:-metabase}
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: 3000
      MB_INSTANCE_ID: ${METABASE_INSTANCE_ID:-metabase-default}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    extra_hosts:
    - "${HOSTNAME}:127.0.0.1"

